name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/marketplace.json plugins/orch/.claude-plugin/plugin.json plugins/orch/hooks/hooks.json; do
            php -n -r 'json_decode(file_get_contents($argv[1]), flags: JSON_THROW_ON_ERROR);' "$f" && echo "ok $f"
          done
      - name: Hook tests
        run: bash tests/hooks-test.sh
